<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Restablece tu contraseña</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f8f9fa; margin:0; padding:0;">
  <div style="max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.07);">
    <div style="background: #34a853; padding: 24px 0; text-align: center;">
      <h1 style="color: #fff; margin: 0; font-size: 2em;">FLESYSTEM</h1>
    </div>
    <div style="padding: 32px;">
      <p>Hola {{ user_email }},</p>
      <p>Para restablecer tu contraseña, haz clic en el siguiente enlace:</p>
      <p style="text-align: center;">
        <a href="{{ reset_link }}" style="display: inline-block; background: #34a853; color: #fff; padding: 12px 28px; border-radius: 4px; text-decoration: none; font-weight: bold;">Restablecer contraseña</a>
      </p>
      <p>Si no solicitaste este cambio, puedes ignorar este mensaje.</p>
      <p style="color: #888; font-size: 0.9em;">&copy; {{ year }} FLESYSTEM</p>
    </div>
  </div>
</body>
</html>
